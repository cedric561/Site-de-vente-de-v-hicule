<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
<title>Catalogue des véhicules</title>
</head>
<body data-page="catalogue">
<header id="nav"></header>

<section class="entete">
  <div class="container">
    <span class="puce">Catalogue</span>
    <h1 class="fw-bold mt-3 mb-1">Tous nos véhicules</h1>
    <p class="mb-0 opacity-75" id="compteur">Chargement…</p>
  </div>
</section>

<section class="py-5 bg-soft">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4 gap-2">
      <button class="btn btn-outline-dark d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#filtres"><i class="bi bi-sliders me-1"></i>Filtres</button>
      <select class="form-select ms-auto" id="tri" style="width:auto"><option value="recent">Plus récents</option><option value="prix_asc">Prix croissant</option><option value="prix_desc">Prix décroissant</option><option value="km_asc">Kilométrage croissant</option></select>
    </div>
    <div class="row g-4">
      <aside class="col-lg-3">
        <div class="offcanvas-lg offcanvas-start" tabindex="-1" id="filtres">
          <div class="offcanvas-header"><h5 class="offcanvas-title">Filtres</h5><button class="btn-close" data-bs-dismiss="offcanvas"></button></div>
          <div class="offcanvas-body d-block">
            <form class="filtres-card" id="form-filtres">
              <label class="form-label small fw-semibold">Recherche</label><input class="form-control mb-3" id="f-q" placeholder="Modèle, mot-clé…">
              <label class="form-label small fw-semibold">Marque</label><select class="form-select mb-3" id="f-marque"><option value="">Toutes</option></select>
              <label class="form-label small fw-semibold">Carburant</label><select class="form-select mb-3" id="f-carburant"><option value="">Tous</option><option>Essence</option><option>Diesel</option><option>Hybride</option><option>Électrique</option></select>
              <label class="form-label small fw-semibold">Année minimum</label><input type="number" class="form-control mb-3" id="f-annee" placeholder="ex. 2018" min="1990" max="2035">
              <label class="form-label small fw-semibold">Prix maximum (FCFA)</label><input type="number" class="form-control mb-4" id="f-prix" step="500000" min="0">
              <button class="btn btn-accent w-100 mb-2" type="submit">Appliquer</button>
              <button class="btn btn-link w-100 text-muted" type="reset">Réinitialiser</button>
            </form>
          </div>
        </div>
      </aside>
      <div class="col-lg-9"><div class="row g-4" id="liste"></div><nav class="mt-5"><ul class="pagination justify-content-center" id="pagination"></ul></nav></div>
    </div>
  </div>
</section>

<footer id="pied"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script><script src="assets/js/demo.js"></script><script src="assets/js/api.js"></script><script src="assets/js/suivi.js"></script><script src="assets/js/app.js"></script>
</body></html>
